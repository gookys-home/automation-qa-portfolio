$kind: http-request
url: https://restful-booker.herokuapp.com/booking/{{bookingid}}
method: DELETE
headers:
  Cookie: token={{token}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });"
    language: text/javascript
order: 5000
