$kind: http-request
description: ""
url: https://restful-booker.herokuapp.com/booking/{{bookingid}}
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Booking data is correct\", function () {\r

      \    const jsonData = pm.response.json();\r

      \r

      \    pm.expect(jsonData.firstname).to.eql(\"SeonGook\");\r

      \    pm.expect(jsonData.lastname).to.eql(\"Yoon\");\r

      \    pm.expect(jsonData.totalprice).to.eql(150000);\r

      \    pm.expect(jsonData.depositpaid).to.eql(true);\r

      \    pm.expect(jsonData.bookingdates.checkin).to.eql(\"2026-10-10\");\r

      \    pm.expect(jsonData.bookingdates.checkout).to.eql(\"2026-10-12\");\r

      \    pm.expect(jsonData.additionalneeds).to.eql(\"Breakfast\");\r

      });\r

      \r

      pm.test(\"Response data types are correct\", function () {\r

      \    const jsonData = pm.response.json();\r

      \r

      \    pm.expect(jsonData.firstname).to.be.a(\"string\");\r

      \    pm.expect(jsonData.lastname).to.be.a(\"string\");\r

      \    pm.expect(jsonData.totalprice).to.be.a(\"number\");\r

      \    pm.expect(jsonData.depositpaid).to.be.a(\"boolean\");\r

      \r

      \    pm.expect(jsonData.bookingdates.checkin).to.be.a(\"string\");\r

      \    pm.expect(jsonData.bookingdates.checkout).to.be.a(\"string\");\r

      });\r

      \r

      pm.test(\"Response schema is valid\", function () {\r

      \    const schema = {\r

      \        type: \"object\",\r

      \        required: [\r

      \            \"firstname\",\r

      \            \"lastname\",\r

      \            \"totalprice\",\r

      \            \"depositpaid\",\r

      \            \"bookingdates\"\r

      \        ],\r

      \        properties: {\r

      \            firstname: {\r

      \                type: \"string\"\r

      \            },\r

      \            lastname: {\r

      \                type: \"string\"\r

      \            },\r

      \            totalprice: {\r

      \                type: \"number\"\r

      \            },\r

      \            depositpaid: {\r

      \                type: \"boolean\"\r

      \            },\r

      \            bookingdates: {\r

      \                type: \"object\",\r

      \                required: [\r

      \                    \"checkin\",\r

      \                    \"checkout\"\r

      \                ],\r

      \                properties: {\r

      \                    checkin: {\r

      \                        type: \"string\"\r

      \                    },\r

      \                    checkout: {\r

      \                        type: \"string\"\r

      \                    }\r

      \                }\r

      \            },\r

      \            additionalneeds: {\r

      \                type: \"string\"\r

      \            }\r

      \        }\r

      \    };\r

      \r

      \    pm.response.to.have.jsonSchema(schema);\r

      });"
    language: text/javascript
order: 3000
